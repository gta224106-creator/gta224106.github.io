### Services [ services ]
services:
  title: "What I Do"
  subtitle: "my <b>Services</b>"
  bg_title: "Services"

  items:
    - title: "네트워크 보안"
      subtitle: "Web Development"
      text: "iptables를 활용한 방화벽 정책 설계 및 다중 구간(Intra/DMZ) 네트워크 보안 환경 구축 실습 경험 보유."
      button_label: "GitHub 보기"
      button_link: "https://github.com/gta224106"

    - title: "웹 취약점 실습"
      subtitle: "Web Security"
      text: "DVWA, WebGoat 환경에서 XSS, SQL Injection 등 주요 웹 취약점 분석 및 모의해킹 실습 수행."
      button_label: "GitHub 보기"
      button_link: "https://github.com/gta224106"

    - title: "리눅스 서버 관리"
      subtitle: "Linux Administration"
      text: "Ubuntu/Kali 기반 서버 환경 구성 및 관리. Linux Master 2급 자격증 보유."
      button_label: "GitHub 보기"
      button_link: "https://github.com/gta224106"

    - title: "셀스크립트 작성"
      subtitle: "Shell Scripting"
      text: "Bash 기반 셸 스크립트 작성 경험. 변수, 조건문, 반복문, sed/grep/sort 활용 자동화 스크립트 구현."
      button_label: "GitHub 보기"
      button_link: "https://github.com/gta224106"

    - title: "파이썬 개발"
      subtitle: "Python Scripting"
      text: "보안 스캐너 프로젝트에서 Python으로 Nuclei/Semgrep 연동 모듈 개발. 취약점 데이터 파싱 및 정규화 구현."
      button_label: "GitHub 보기"
      button_link: "https://github.com/gta224106"

